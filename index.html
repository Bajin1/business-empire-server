<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Business Empire</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Segoe UI',system-ui,sans-serif;background:radial-gradient(ellipse at center,#1a2547 0%,#0a1128 70%);color:#fff;height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body.fullscreen{padding:0!important}
button{background:linear-gradient(180deg,#ffd700,#d4a017);color:#000;border:none;padding:10px 16px;border-radius:8px;font-weight:700;cursor:pointer;font-size:14px;transition:all .15s}
button:hover:not(:disabled){filter:brightness(1.15)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:linear-gradient(180deg,#ffb700,#ff8800);width:100%}
button.ghost{background:rgba(255,255,255,.15);color:#fff}
button.selected{outline:3px solid #fff}
button.buildBtn{background:linear-gradient(180deg,#4ecca3,#2a8f6e);color:#fff;padding:14px 12px;font-size:15px;font-weight:800;width:auto;flex:1;letter-spacing:.5px}
button.sellBtn{background:linear-gradient(180deg,#e67e22,#b85c0e);color:#fff;padding:14px 12px;font-size:15px;font-weight:800;width:auto;flex:1;letter-spacing:.5px}
button.passerBtn{width:100%;padding:16px 20px;font-size:18px;font-weight:900;letter-spacing:2px;background:linear-gradient(180deg,#ffd700,#d4a017);color:#1a1a1a;border:2px solid #b8860b;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.5),0 0 20px rgba(255,215,0,.5);text-shadow:0 1px 0 rgba(255,255,255,.4);transition:all .2s}
button.passerBtn:hover:not(:disabled){filter:brightness(1.15);transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.6),0 0 26px rgba(255,215,0,.7)}
button.passerBtn:active:not(:disabled){transform:translateY(1px);box-shadow:0 2px 6px rgba(0,0,0,.5)}
button.passerBtn:disabled{opacity:.35;cursor:not-allowed}
#setup{position:fixed;inset:0;background:#0a1128;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:500;padding:20px;overflow-y:auto}
#setup h1{font-size:42px;color:#ffd700;letter-spacing:5px;text-shadow:0 0 30px #ffd70099}
.panelSetup{display:flex;flex-direction:column;gap:14px;background:rgba(255,255,255,.06);padding:24px;border-radius:14px;border:1px solid rgba(255,215,0,.3);min-width:400px;max-width:520px}
.panelSetup label{display:flex;justify-content:space-between;align-items:center;font-size:15px;gap:14px}
.panelSetup input{padding:10px;border-radius:6px;border:2px solid #ffd70055;background:#050818;color:#fff;width:170px;font-size:15px}
.modeGroup{display:flex;gap:10px}
.modeGroup button{flex:1;padding:14px;font-size:13px;line-height:1.3}
#lobbyInfo{display:none;font-size:13px;line-height:1.6;background:rgba(0,0,0,.4);padding:14px;border-radius:10px;border:1px solid rgba(255,215,0,.4);max-height:240px;overflow-y:auto}
#lobbyPlayers{display:flex;flex-direction:column;gap:6px}
#app{display:none;flex-direction:column;gap:10px;padding:12px;max-width:100vw;max-height:100vh;align-items:center}
#app.fullscreen{padding:4px;gap:6px}
#mainRow{display:flex;gap:14px;align-items:flex-start;max-width:100vw;perspective:2400px;perspective-origin:50% 55%;transition:gap .3s}
#board{display:grid;grid-template-columns:repeat(11,1fr);grid-template-rows:repeat(11,1fr);width:min(96vw,98vh);height:min(96vw,98vh);background:#f0ead8;border:5px solid #2c1810;border-radius:10px;position:relative;transition:transform .15s linear,box-shadow .5s ease;transform-style:preserve-3d;will-change:transform}
body.fullscreen #board{width:min(98vw,99vh);height:min(98vw,99vh)}
body.view-3d #mainRow{gap:180px;perspective:2200px;perspective-origin:50% 55%}
body.view-3d.fullscreen #mainRow{gap:220px}
body.view-3d #board{transform:rotateX(var(--rotX,42deg)) rotateZ(var(--rotZ,0deg)) scale(var(--zoom,1.05)) translate(0,0);transform-style:preserve-3d;box-shadow:0 100px 160px -40px rgba(0,0,0,.95),0 0 80px rgba(255,215,0,.35),0 40px 60px -20px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,215,0,.5);cursor:grab}
body.view-3d #board.grabbing{cursor:grabbing}
body.view-3d .cell{transform:translateZ(2px);transition:transform .25s ease}
body.view-3d .cell:hover{transform:translateZ(15px);outline:3px solid #ffd700}
body.view-3d #panel{transform:translateX(60px);margin-left:60px;max-height:92vh}
body.view-3d.fullscreen #panel{transform:translateX(100px);margin-left:100px;max-height:96vh}
#view3dHelp{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#ffd700;padding:8px 16px;border-radius:20px;font-size:12px;z-index:550;border:1px solid rgba(255,215,0,.5);display:none;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,.6)}
body.view-3d #view3dHelp{display:block}
.cell{position:relative;border:1px solid #b8a582;display:flex;flex-direction:column;overflow:visible;cursor:pointer;background-clip:padding-box;min-width:0}
.cell:hover{outline:3px solid #ffd700;z-index:20}
.cell .band{height:18%}
.cell .body{flex:1;padding:2px 3px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;color:#000;font-weight:700;gap:1px;min-width:0}
.cell .name{font-family:'Arial Narrow','Helvetica Neue',Arial,sans-serif;font-size:clamp(7px,1.2vh,14px);line-height:1;font-weight:900;color:#000;text-shadow:0 0 2px #fff,0 0 3px #fff;word-break:break-word;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto;letter-spacing:-0.2px;flex:1;display:flex;align-items:center;justify-content:center;text-align:center}
.cell .icon{font-size:clamp(16px,3vh,32px);line-height:1}
.cell .price{font-family:'Arial Narrow',Arial,sans-serif;font-size:clamp(9px,1.5vh,18px);background:#fff;color:#000;border:2px solid #000;border-radius:4px;padding:1px 4px;font-weight:900;white-space:nowrap;line-height:1.05;max-width:100%;box-shadow:0 1px 2px rgba(0,0,0,.25);letter-spacing:-0.3px}
.cell.owned{box-shadow:inset 0 0 0 4px currentColor}
.cell.mortgaged{filter:brightness(0.78) saturate(0.75)}
.cell.mortgaged::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:4;background:repeating-linear-gradient(45deg,rgba(0,0,0,.32) 0,rgba(0,0,0,.32) 1.5px,rgba(255,255,255,.14) 1.5px,rgba(255,255,255,.14) 12px)}
.cell.corner{background:#b8e6c1!important}
.cell.corner .name{font-size:clamp(8px,1.2vh,14px);color:#2c1810;text-shadow:none}
.cell.shaking{animation:earthquake .12s linear infinite}
@keyframes earthquake{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-2px,-1px) rotate(-1deg)}50%{transform:translate(2px,1px) rotate(1deg)}75%{transform:translate(-1px,2px) rotate(-0.5deg)}100%{transform:translate(0,0) rotate(0)}}
.cell.hypoFlash{animation:hypoFlashAnim .7s ease-in-out 10;z-index:50 !important}
@keyframes hypoFlashAnim{0%{background-color:inherit;box-shadow:inset 0 0 0 4px currentColor}50%{background-color:#333333;box-shadow:inset 0 0 0 4px #000,0 0 0 20px #000}100%{background-color:inherit;box-shadow:inset 0 0 0 4px currentColor}}
.filialeFall{animation:filialeFallAnim .9s ease-in forwards !important;display:inline-block}
@keyframes filialeFallAnim{0%{opacity:1;transform:translateY(0) rotate(0deg) scale(1)}30%{opacity:1;transform:translateY(2px) rotate(15deg) scale(1.05)}60%{opacity:.7;transform:translateY(8px) rotate(45deg) scale(.9)}100%{opacity:0;transform:translateY(20px) rotate(90deg) scale(.5)}}
.tokens{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;gap:1px;justify-content:center;align-content:flex-end;max-width:95%;max-height:70%;overflow:visible;z-index:5;padding:1px}
.ballon{width:clamp(38px,6vh,72px);height:clamp(38px,6vh,72px);position:relative;border:none;background:transparent!important;overflow:visible;box-shadow:none;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ballon::before{display:none!important}
.ballonEmoji{font-size:clamp(38px,6.2vh,68px);line-height:1;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 2px 4px rgba(0,0,0,.95)) drop-shadow(0 0 2px rgba(255,255,255,.4));text-align:center;font-weight:900}
.ballon .ballonImg{width:160%;height:160%;object-fit:contain;display:block;filter:drop-shadow(0 3px 6px rgba(0,0,0,.95)) drop-shadow(0 0 4px rgba(255,215,0,.6));pointer-events:none;transform:translate(-18.75%,-18.75%)}
.tokens.many .ballon{width:clamp(30px,4.6vh,52px)!important;height:clamp(30px,4.6vh,52px)!important}
.tokens.many .ballonEmoji{font-size:clamp(30px,5vh,54px)!important}
.tokens.many .ballon .ballonImg{width:150%;height:150%;transform:translate(-16.7%,-16.7%);padding:0}
.ballon.locomotive{background:transparent!important;border-radius:0;box-shadow:none;position:relative}
.ballon.locomotive::after{content:'';position:absolute;top:-75%;left:55%;width:38%;height:38%;background:radial-gradient(circle,rgba(230,230,230,.9) 0%,rgba(180,180,180,.5) 50%,transparent 70%);border-radius:50%;animation:smoke 1.1s ease-out infinite;z-index:5}
@keyframes smoke{0%{opacity:.95;transform:translateY(0) scale(.6)}50%{opacity:.6;transform:translateY(-30%) scale(1.3)}100%{opacity:0;transform:translateY(-70%) scale(1.8)}}
.ballon.police{background:transparent!important;border-radius:50%;box-shadow:0 0 14px #ff1744,0 0 22px #1565c0}
.ballon.police::after{content:'';position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:80%;height:8px;background:linear-gradient(90deg,#ff1744 0%,#ff1744 50%,#2979ff 50%,#2979ff 100%);border-radius:3px;animation:flash .4s linear infinite}
@keyframes flash{0%,49%{opacity:1}50%,100%{opacity:.3}}
.token.hop{animation:hop .6s ease}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.filiales{position:absolute;top:auto;bottom:26px;left:3px;font-size:clamp(10px,1.5vh,17px);color:#000;text-shadow:0 0 2px #fff,0 0 4px #fff,0 0 6px #fff;font-weight:900;z-index:8;line-height:1;letter-spacing:-2px;max-width:70%}
.filiales.siege{font-size:clamp(22px,3.4vh,40px)!important;letter-spacing:0!important;bottom:22px;left:4px;line-height:1;filter:drop-shadow(0 0 4px #ffd700) drop-shadow(0 0 8px #ffd700);animation:siegePulse 1.8s ease-in-out infinite}
@keyframes siegePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
#ownersLayer{position:absolute;inset:0;pointer-events:none;z-index:10;overflow:visible}
.ownerPill{position:absolute;width:clamp(16px,2.2vh,24px);height:clamp(16px,2.2vh,24px);border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.65);border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.85),0 0 5px rgba(255,215,0,.4);pointer-events:auto;box-sizing:border-box;z-index:15;overflow:visible}
.ownerPill .ownerEmoji{font-size:clamp(11px,1.6vh,18px);line-height:1;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.9))}
.ownerPill .ballonImg{width:80%;height:80%;object-fit:contain;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.9));pointer-events:none}
#center{grid-column:2/11;grid-row:2/11;background:radial-gradient(circle,#1e3c72,#0a1128);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ffd700;text-align:center;position:relative;overflow:hidden}
#center h1{font-size:clamp(24px,5vh,60px);letter-spacing:5px;text-shadow:0 0 25px #ffd700}
#center h2{font-size:clamp(10px,1.6vh,18px);color:#fff;opacity:.7;font-style:italic;margin-top:6px}
#centerDice{display:none;gap:clamp(18px,2.4vw,32px);margin-top:18px;justify-content:center;perspective:1400px;perspective-origin:50% 50%}
#centerDice.show{display:flex}
.dieScene{--die-size:clamp(60px,9vh,95px);--die-half:calc(var(--die-size) / 2);width:var(--die-size);height:var(--die-size);perspective:800px;cursor:pointer;position:relative;user-select:none}
.dieScene::after{content:'';position:absolute;bottom:-20px;left:5%;right:5%;height:12px;background:radial-gradient(ellipse at center,rgba(0,0,0,.75),transparent 70%);filter:blur(8px);z-index:-1;pointer-events:none}
.dieViewer{width:100%;height:100%;transform-style:preserve-3d;transform:rotateX(-55deg) rotateY(-25deg)}
.dieCube{width:100%;height:100%;position:relative;transform-style:preserve-3d;transform:rotateX(0deg) rotateY(0deg);transition:transform 1.6s cubic-bezier(.22,.9,.3,1);will-change:transform}
.dieFace3D{position:absolute;inset:0;background:radial-gradient(circle at 30% 25%, #ffffff 0%, #f7f7f7 55%, #e0e0e0 100%);border-radius:clamp(8px,1.2vh,14px);border:2px solid rgba(0,0,0,.15);box-shadow:inset 0 -4px 10px rgba(0,0,0,.15),inset 0 4px 10px rgba(255,255,255,.9);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:4%;padding:12%;backface-visibility:hidden;box-sizing:border-box}
.faceFront {transform:translateZ(var(--die-half))}
.faceBack  {transform:rotateY(180deg) translateZ(var(--die-half))}
.faceRight {transform:rotateY(90deg)  translateZ(var(--die-half))}
.faceLeft  {transform:rotateY(-90deg) translateZ(var(--die-half))}
.faceTop   {transform:rotateX(90deg)  translateZ(var(--die-half))}
.faceBottom{transform:rotateX(-90deg) translateZ(var(--die-half))}
.pip{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 30% 30%, #555 0%, #222 60%, #000 100%);box-shadow:inset 0 1px 2px rgba(255,255,255,.4),inset 0 -2px 3px rgba(0,0,0,.8);align-self:center;justify-self:center;transform:scale(.82)}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
#centerMoney{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:none;font-size:clamp(24px,4.5vh,64px);font-weight:900;color:#fff;padding:16px 30px;border-radius:16px;background:rgba(0,0,0,.85);border:3px solid #ffd700;z-index:60;white-space:nowrap;text-align:center;max-width:95%}
#centerMoney.show{display:block;animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
#payBubble{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.92);border:3px solid #ffd700;border-radius:16px;padding:22px 30px;color:#fff;z-index:85;display:none;text-align:center;min-width:340px}
#payBubble.show{display:block;animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
#payBubble .payRow{display:flex;align-items:center;justify-content:center;gap:20px;font-size:clamp(14px,2.2vh,22px);font-weight:800}
#payBubble .payArrow{font-size:clamp(24px,4vh,48px);color:#ffd700;animation:arrowMove 1s linear infinite}
@keyframes arrowMove{0%{transform:translateX(-8px);opacity:.5}50%{transform:translateX(8px);opacity:1}100%{transform:translateX(-8px);opacity:.5}}
#payBubble .payAmount{margin-top:14px;font-size:clamp(20px,3.5vh,44px);font-weight:900;color:#ff5757}
#roueOverlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);z-index:120;overflow:hidden}
#roueOverlay.show{display:flex}
#roueBox{position:relative;width:clamp(280px,60vh,520px);height:clamp(280px,60vh,520px);animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
#roueBox svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 30px rgba(255,215,0,.7)) drop-shadow(0 12px 30px rgba(0,0,0,.9));transform-origin:center center}
#roueBox .roueArrow{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:clamp(30px,5vh,50px);color:#ffd700;filter:drop-shadow(0 0 12px #ffd700) drop-shadow(0 3px 6px rgba(0,0,0,.9));z-index:5;pointer-events:none}
#roueBox .roueCenter{position:absolute;top:50%;left:50%;width:clamp(50px,10vh,90px);height:clamp(50px,10vh,90px);transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#fff7d1,#d4a017 70%,#8a6000);border:4px solid #ffd700;box-shadow:0 0 20px rgba(255,215,0,.9),inset 0 0 10px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-size:clamp(24px,4vh,42px);z-index:4}
#roueResultat{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.95);border:3px solid #ffd700;border-radius:16px;padding:22px 30px;color:#fff;z-index:130;display:none;text-align:center;max-width:80%;font-size:clamp(15px,2.2vh,24px);font-weight:800;line-height:1.4;box-shadow:0 0 40px rgba(255,215,0,.6)}
#roueResultat.show{display:block;animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
#roueResultat.gain{color:#7CFC00;border-color:#7CFC00}
#roueResultat.perte{color:#ff5757;border-color:#ff5757}
#starsShower{position:absolute;inset:0;pointer-events:none;z-index:90;display:none;overflow:hidden}
#starsShower.show{display:block}
.star{position:absolute;font-size:clamp(20px,3.5vh,44px);animation:starFly 2.2s ease-out forwards}
@keyframes starFly{0%{opacity:1;transform:translate(0,0) rotate(0deg) scale(.5)}30%{opacity:1;transform:translate(var(--dx1),var(--dy1)) rotate(180deg) scale(1.3)}100%{opacity:0;transform:translate(var(--dx2),var(--dy2)) rotate(720deg) scale(.2)}}
#confetti{position:absolute;inset:0;pointer-events:none;z-index:95;display:none;overflow:hidden}
#confetti.show{display:block}
.confettiPiece{position:absolute;width:8px;height:14px;opacity:0;animation:confettiFall 3s linear forwards}
@keyframes confettiFall{0%{opacity:1;transform:translateY(-100px) rotate(0deg)}100%{opacity:0;transform:translateY(calc(100% + 100px)) rotate(720deg)}}
#panel{width:min(26vw,300px);display:flex;flex-direction:column;gap:8px;max-height:95vh;overflow-y:auto;transition:height .3s,margin .3s,transform .3s}
body.fullscreen #panel{max-height:96vh}
.box{background:rgba(255,255,255,.08);border:1px solid rgba(255,215,0,.3);border-radius:10px;padding:10px}
#passerBox{display:flex;justify-content:center;padding:10px !important}
#turnLabel{font-size:15px;font-weight:700;color:#ffd700;text-align:center}
#players{font-size:14px;display:flex;flex-direction:column;gap:6px}
.playerRow{display:flex;align-items:center;gap:10px;padding:11px 9px;border-radius:8px;background:rgba(255,255,255,.05);cursor:pointer;transition:filter .15s,box-shadow .15s;position:relative}
.playerRow:hover{filter:brightness(1.2)}
.playerRow.active{box-shadow:0 0 0 2px #ffd700,0 0 18px rgba(255,215,0,.6);filter:brightness(1.15)}
.playerRow.bankrupt{opacity:.25;text-decoration:line-through}
.avatarBadge{width:50px;height:50px;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative}
.playerName{font-weight:700;font-size:14px;line-height:1.2}
.playerType{font-size:11px;opacity:.7;margin-top:2px}
.money{margin-left:auto;font-weight:900;color:#7CFC00;font-size:clamp(18px,2.4vh,24px);text-shadow:0 0 8px #7CFC00;white-space:nowrap;background:rgba(124,252,0,.08);padding:2px 8px;border-radius:6px;border:1px solid rgba(124,252,0,.35)}
.money.negative{color:#ff5757;text-shadow:0 0 8px #ff5757;background:rgba(255,87,87,.1);border-color:rgba(255,87,87,.5)}
#actionBar{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#actionBar button{width:100%}
#fullscreenBtn{position:fixed;top:12px;right:12px;z-index:600;background:linear-gradient(180deg,#4ecca3,#2a8f6e);color:#fff;padding:10px 16px;font-size:14px}
#view3dBtn{position:fixed;top:60px;right:12px;z-index:600;background:linear-gradient(180deg,#7b1fa2,#4a0072);color:#fff;padding:10px 16px;font-size:14px}
#soundBtn{position:fixed;top:108px;right:12px;z-index:600;background:linear-gradient(180deg,#4ecca3,#2a8f6e);color:#fff;padding:10px 16px;font-size:14px}
body.view-3d #view3dBtn{background:linear-gradient(180deg,#ffb700,#ff8800)}
#timerBox{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.9);border:3px solid #ffd700;border-radius:14px;padding:10px 18px;color:#ffd700;z-index:400;display:none;width:min(360px,80vw);box-shadow:0 4px 20px rgba(0,0,0,.6)}
#timerBox.show{display:block}
#timerBar{width:100%;height:18px;background:rgba(255,255,255,.15);border-radius:10px;overflow:hidden;border:1px solid rgba(255,215,0,.4)}
#timerBarFill{height:100%;width:100%;background:linear-gradient(90deg,#7CFC00,#ffd700);border-radius:10px;transition:width .9s linear}
#timerLabel{font-size:13px;font-weight:700;text-align:center;margin-top:4px;letter-spacing:1px}
#timerBox.warning #timerBarFill{background:linear-gradient(90deg,#ff8800,#ff3b30)}

function rent(prop){
  if(prop.owner==null)return 0;
  if(prop.hypotheque)return 0;
  if(prop.sector==='ferro'){
    var cnt=BOARD.filter(function(b){return b.sector==='ferro'&&b.owner===prop.owner&&!b.hypotheque;}).length;
    return [0,2500,5000,10000,20000][cnt]||2500;
  }
  if(prop.type==='eaux')return 500;
  if(prop.type==='eaux2')return 2000;
  var loyerBase=prop.rents[Math.min(prop.filiales||0,5)];
  if((prop.filiales||0)===0){
    var total=BOARD.filter(function(b){return b.sector===prop.sector;}).length;
    var owned=BOARD.filter(function(b){return b.sector===prop.sector&&b.owner===prop.owner;}).length;
    if(owned===total)loyerBase=loyerBase*2;
  }
  return loyerBase;
}
function canBuild(p,prop){
  if(prop.type!=='property')return false;
  if(prop.owner!==S.players.indexOf(p))return false;
  if(prop.sector==='ferro'||prop.sector==='eaux')return false;
  if((prop.filiales||0)>=5)return false;
  if(prop.hypotheque)return false;
  var total=BOARD.filter(function(b){return b.sector===prop.sector;}).length;
  var owned=BOARD.filter(function(b){return b.sector===prop.sector&&b.owner===S.players.indexOf(p);}).length;
  if(owned!==total)return false;
  var autres=BOARD.filter(function(b){return b.sector===prop.sector&&b.owner===S.players.indexOf(p)&&b!==prop;});
  var minAutres=5;autres.forEach(function(b){if((b.filiales||0)<minAutres)minAutres=(b.filiales||0);});
  if((prop.filiales||0)>minAutres)return false;
  return true;
}
function possedeSecteurComplet(p,sector){
  var total=BOARD.filter(function(b){return b.sector===sector;}).length;
  var owned=BOARD.filter(function(b){return b.sector===sector&&b.owner===S.players.indexOf(p);}).length;
  return total===owned&&total>0;
}

async function tenterEviterRuine(p,montant,creancier){
  var pIdx=S.players.indexOf(p);
  var propsNoFiliale=BOARD.filter(function(b){return b.owner===pIdx&&b.type==='property'&&!b.hypotheque&&(b.filiales||0)===0;});
  for(var i=0;i<propsNoFiliale.length&&p.money<montant;i++){propsNoFiliale[i].hypotheque=true;p.money+=Math.round(propsNoFiliale[i].price/2);}
  if(p.money>=montant){refreshBoard();return true;}
  var propsRestantes=BOARD.filter(function(b){return b.owner===pIdx&&b.type==='property'&&!b.hypotheque;});

  refreshBoard();

}

/* ============================================================
   ENCHÈRES
   ============================================================ */
var ENCHERE = {
  active: false,
  propriete: null,
  miseActuelle: 0,
  dernierEncherisseur: null,
  ordre: [],
  encherisseurIdx: 0,
  toursSansEnchere: 0,
  attente: null,
  attenteTimer: null,
  resolve: null
};

function palierEnchere(miseActuelle) {
  if (miseActuelle < 10000) return 500;
  if (miseActuelle < 25000) return 1000;
  if (miseActuelle < 50000) return 2500;
  if (miseActuelle < 100000) return 5000;
  return 10000;
}

async function lancerEnchere(declencheur, propriete) {
  if (ENCHERE.active) return;
  ENCHERE_EN_COURS = true;
  ENCHERE.active = true;
  ENCHERE.propriete = propriete;
  ENCHERE.miseActuelle = Math.floor(propriete.price / 2);
  ENCHERE.dernierEncherisseur = null;
  ENCHERE.toursSansEnchere = 0;
  ENCHERE.encherisseurIdx = 0;
  ENCHERE.ordre = S.players
    .map(function(pl, i) { return { p: pl, i: i }; })
    .filter(function(o) { return o.p && !o.p.bankrupt && o.p.money >= ENCHERE.miseActuelle; })
    .map(function(o) { return o.i; });

  if (ENCHERE.ordre.length === 0) {
    await showModal(
      '<h2>🔨 Enchère</h2><p>Aucun joueur solvable pour <b>' + propriete.name + '</b>.</p>',
      [{ label: 'OK', value: 'ok', cls: 'primary' }]
    );
    ENCHERE.active = false;
    ENCHERE_EN_COURS = false;
    return;
  }

  logEvent('INFO', 'Enchère ouverte : ' + propriete.name + ' — mise ' + fmt(ENCHERE.miseActuelle));
  broadcastState();

  await new Promise(function(resolve) {
    ENCHERE.resolve = resolve;
    prochainEncherisseur();
  });

  var gagnant = ENCHERE.dernierEncherisseur;
  var mise = ENCHERE.miseActuelle;
  ENCHERE.active = false;
  ENCHERE_EN_COURS = false;

  if (gagnant !== null && S.players[gagnant]) {
    var g = S.players[gagnant];
    g.money -= mise;
    propriete.owner = gagnant;
    propriete.filiales = 0;
    propriete.hypotheque = false;
    playBuySound();
    await showMoney(-mise, 'Enchère gagnée : ' + propriete.name);
    logEvent('INFO', g.name + ' remporte ' + propriete.name + ' pour ' + fmt(mise));
    if (WS.isHost) broadcastState();
  } else {
    logEvent('INFO', 'Enchère ' + propriete.name + ' : sans preneur.');
  }
  refreshBoard();
}

async function prochainEncherisseur() {
  if (!ENCHERE.active) return;
  if (ENCHERE.toursSansEnchere >= ENCHERE.ordre.length) {
    terminerEnchere();
    return;
  }

  var idxJ = ENCHERE.ordre[ENCHERE.encherisseurIdx % ENCHERE.ordre.length];
  ENCHERE.encherisseurIdx++;
  var joueur = S.players[idxJ];

  if (ENCHERE.dernierEncherisseur === idxJ) {
    ENCHERE.toursSansEnchere++;
    prochainEncherisseur();
    return;
  }

  var pas = palierEnchere(ENCHERE.miseActuelle);
  var miseCible = ENCHERE.miseActuelle + pas;

  if (joueur.isAI) {
    var maxIA = Math.floor(ENCHERE.propriete.price * (1 + (joueur.prudence || 3) * 0.05));
    if (joueur.money >= miseCible && miseCible <= maxIA) {
      ENCHERE.miseActuelle = miseCible;
      ENCHERE.dernierEncherisseur = idxJ;
      ENCHERE.toursSansEnchere = 0;
      logEvent('INFO', joueur.name + ' enchérit à ' + fmt(ENCHERE.miseActuelle));
      if (WS.isHost) broadcastState();
    } else {
      ENCHERE.toursSansEnchere++;
    }
    await sleep(400);
    prochainEncherisseur();
    return;
  }

  if (joueur.isRemote) {
    ENCHERE.attente = idxJ;
    var clientIndex = (joueur.remoteIndex !== undefined) ? joueur.remoteIndex : idxJ;
    wsSend({
      to: clientIndex,
      type: 'auction-ask',
      propriete: ENCHERE.propriete.name,
      pos: BOARD.indexOf(ENCHERE.propriete),
      miseActuelle: ENCHERE.miseActuelle,
      pas: pas,
      votreArgent: joueur.money
    });
    ENCHERE.attenteTimer = setTimeout(function() {
      if (ENCHERE.attente === idxJ) {
        logEvent('WARN', joueur.name + ' n\'a pas répondu à l\'enchère.');
        ENCHERE.toursSansEnchere++;
        ENCHERE.attente = null;
        if (WS.isHost) broadcastState();
        prochainEncherisseur();
      }
    }, 20000);
    if (WS.isHost) broadcastState();
    return;
  }

  var html = '<h2>🔨 Enchère : ' + ENCHERE.propriete.name + '</h2>' +
    '<p>Mise actuelle : <b style="color:#ffd700;font-size:20px">' + fmt(ENCHERE.miseActuelle) + '</b></p>' +
    '<p>Votre argent : <b>' + fmt(joueur.money) + '</b></p>' +
    (ENCHERE.dernierEncherisseur !== null
      ? '<p>Plus offrant : <b>' + S.players[ENCHERE.dernierEncherisseur].name + '</b></p>'
      : '');
  var choix = await showModal(html, [
    { label: 'Enchérir +' + fmt(pas), value: 'bid', cls: 'primary' },
    { label: 'Se retirer', value: 'pass', cls: 'ghost' }
  ]);
  if (choix === 'bid' && joueur.money >= miseCible) {
    ENCHERE.miseActuelle = miseCible;
    ENCHERE.dernierEncherisseur = idxJ;
    ENCHERE.toursSansEnchere = 0;
    playDingSound();
    if (WS.isHost) broadcastState();
  } else {
    ENCHERE.toursSansEnchere++;
  }
  prochainEncherisseur();
}

function terminerEnchere() {
  clearTimeout(ENCHERE.attenteTimer);
  ENCHERE.attenteTimer = null;
  ENCHERE.attente = null;
  if (ENCHERE.resolve) {
    var r = ENCHERE.resolve;
    ENCHERE.resolve = null;

}

/* ============================================================
   RÉSEAU — WEBSOCKET
   ============================================================ */
function wsConnect(onOpen){
  if(WS.socket&&WS.socket.readyState===WebSocket.OPEN){onOpen&&onOpen();return;}
  try{WS.socket=new WebSocket(WS_URL);}
  catch(e){alert('Impossible de se connecter au serveur : '+e.message);return;}
  WS.socket.onopen=function(){
    WS.connected=true;WS.reconnectAttempts=0;
    majNetStatus(true);
    onOpen&&onOpen();
  };
  WS.socket.onclose=function(){
    WS.connected=false;majNetStatus(false);
    if(WS.isClient&&!S.gameOver&&WS.reconnectAttempts<3){
      WS.reconnectAttempts++;
      logEvent('WARN','Reconnexion tentative '+WS.reconnectAttempts);
      setTimeout(function(){wsConnect(null);},1500*WS.reconnectAttempts);
    }
  };
  WS.socket.onerror=function(e){logEvent('ERROR','WS: '+(e.message||'erreur'));};
  WS.socket.onmessage=function(ev){
    var msg;try{msg=JSON.parse(ev.data);}catch(e){return;}
    wsHandleMessage(msg);
  };
}
function wsSend(obj){
  if(WS.socket&&WS.socket.readyState===WebSocket.OPEN){
    try{WS.socket.send(JSON.stringify(obj));}catch(e){}
  }
}
function majNetStatus(online){
  var el=document.getElementById('netStatus');if(!el)return;
  if(NET.mode==='local'){el.classList.remove('show');return;}
  el.classList.add('show');
  if(online){el.classList.remove('offline');el.textContent='🌐 Connecté';}
  else{el.classList.add('offline');el.textContent='🌐 Hors ligne';}
}

function wsHandleMessage(msg){
  if(!msg||!msg.type)return;
  switch(msg.type){
    case 'created':
      WS.roomCode=msg.roomCode;
      var rd=document.getElementById('roomCodeDisplay');if(rd)rd.textContent=msg.roomCode;
      logEvent('INFO','Salle créée : '+msg.roomCode);
      break;

    case 'joined':
      WS.myIndex=msg.myIndex;WS.roomCode=msg.roomCode;
      logEvent('INFO','Rejoint '+msg.roomCode+' index '+WS.myIndex);
      afficherEcranAttente();
      break;

    case 'error':
      alert('Erreur serveur : '+msg.message);
      break;

    case 'client-joined':
      ajouterJoueurDistant(msg.index,msg.name);
      rafraichirLobby();
      broadcastState();
      break;

    case 'client-left':
      logEvent('WARN','Client '+msg.index+' parti');
      if(S.players[msg.index]){
        S.players[msg.index].bankrupt=true;
        S.players[msg.index].isRemote=false;
      }
      for(var i=msg.index+1;i<S.players.length;i++){
        if(S.players[i])S.players[i].remoteIndex=i-1;
      }
      refreshBoard();updatePanel();
      break;

    case 'reindex':
      WS.myIndex=msg.newIndex;
      logEvent('INFO','Réindexé : '+msg.oldIndex+' → '+msg.newIndex);
      break;

    case 'state':
      if(WS.isClient)appliquerEtatComplet(msg.state);
      break;

    case 'action':
      if(WS.isHost)traiterActionClient(msg.from,msg.action,msg.payload||{});
      break;

    case 'auction-ask':
      afficherEnchereClient(msg);
      break;

    case 'auction-state':
      if (ENCHERE.active && S.players[ENCHERE.dernierEncherisseur]) {
        logEvent('INFO', 'Mise à ' + fmt(msg.miseActuelle) + ' par ' + S.players[ENCHERE.dernierEncherisseur].name);
      }
      break;

    case 'host-left':
      alert("L'hôte a quitté la partie.");
      location.reload();
      break;
  }
}

async function afficherEnchereClient(msg) {
  var html = '<h2>🔨 Enchère : ' + msg.propriete + '</h2>' +
    '<p>Mise actuelle : <b style="color:#ffd700;font-size:20px">' + fmt(msg.miseActuelle) + '</b></p>' +
    '<p>Votre argent : <b>' + fmt(msg.votreArgent) + '</b></p>' +
    '<p style="font-size:13px;opacity:.7">Temps restant : <b id="aucTimer">20</b> s</p>';

  var intervalId = setInterval(function() {
    var el = document.getElementById('aucTimer');
    if (el) {
      var v = parseInt(el.textContent, 10) - 1;
      if (v >= 0) el.textContent = v;
    }
  }, 1000);

  var choix = await showModal(html, [
    { label: 'Enchérir +' + fmt(msg.pas), value: 'bid', cls: 'primary' },
    { label: 'Se retirer', value: 'pass', cls: 'ghost' }
  ]);

  clearInterval(intervalId);

  wsSend({
    type: 'action',
    action: 'auction-response',
    payload: {
      pos: msg.pos,
      bid: choix === 'bid'
    }
  });
}

function ajouterJoueurDistant(index,name){
  if(S.players[index]&&S.players[index].isRemote)return;
  S.players[index]={
    name:name||('Joueur '+index),
    color:COLORS[index%COLORS.length],
    money:150000,pos:0,isAI:false,jailTurns:0,
    bankrupt:false,isRemote:true,prudence:3
  };
  logEvent('INFO','Joueur distant : '+name+' (index '+index+')');
}

function traiterActionClient(fromIndex,action,payload){
  if(fromIndex!==S.current){
    wsSend({to:fromIndex,type:'action-rejected',reason:'Pas votre tour'});
    return;
  }
  var p=S.players[fromIndex];
  if(!p||p.bankrupt)return;

  switch(action){
    case 'roll':
      doRoll(p).then(function(){broadcastState();});
      break;
    case 'endTurn':
      if(S.animating)return;
      stopTurnTimer();nextTurn();
      break;
    case 'buy':
      acheterFilialePour(fromIndex,payload.pos);
      break;
    case 'sell':
      rendreFilialePour(fromIndex,payload.pos);
      break;
    case 'mortgage':
      hypothequerPour(fromIndex,payload.pos);
      break;
    case 'unmortgage':
      leverHypothequePour(fromIndex,payload.pos);
      break;
    case 'auction-response':
      traiterReponseEnchere(fromIndex, payload);
      break;
  }
}

function traiterReponseEnchere(fromIndex, payload) {
  if (!ENCHERE.active) return;
  if (ENCHERE.attente !== fromIndex) {
    logEvent('WARN', 'Réponse d\'enchère hors tour de la part de ' + fromIndex);
    return;
  }
  clearTimeout(ENCHERE.attenteTimer);
  ENCHERE.attenteTimer = null;
  ENCHERE.attente = null;

  var joueur = S.players[fromIndex];
  var pas = palierEnchere(ENCHERE.miseActuelle);
  var miseCible = ENCHERE.miseActuelle + pas;

  if (payload.bid && joueur.money >= miseCible) {
    ENCHERE.miseActuelle = miseCible;
    ENCHERE.dernierEncherisseur = fromIndex;
    ENCHERE.toursSansEnchere = 0;
    playDingSound();
    logEvent('INFO', joueur.name + ' enchérit à ' + fmt(ENCHERE.miseActuelle));
  } else {
    ENCHERE.toursSansEnchere++;
  }
  if (WS.isHost) broadcastState();
  prochainEncherisseur();
}

function serializeState(){
  return {
    players:S.players.filter(function(p){return p;}).map(function(p){
      return {
        name:p.name,color:p.color,money:p.money,pos:p.pos,
        isAI:!!p.isAI,jailTurns:p.jailTurns||0,
        bankrupt:!!p.bankrupt,isRemote:!!p.isRemote,prudence:p.prudence||3
      };
    }),
    board:BOARD.map(function(b){return{owner:b.owner,filiales:b.filiales||0,hypotheque:!!b.hypotheque};}),
    current:S.current,gameOver:S.gameOver,heritagePot:S.heritagePot,
    social1Pot:S.social1Pot||0,mode:S.mode,doubleCount:S.doubleCount||0,
    lastDice:S.lastDice||null,lastAction:S.lastAction||null,

      propriete: ENCHERE.propriete.name,

function broadcastState(){

}

function menuReseau(){

}
function quitterPartie(){
  showModal('<h2>🚪 Quitter</h2><p>Voulez-vous vraiment quitter ?</p>',[
    {label:'Oui',value:'yes',cls:'primary'},{label:'Non',value:'no',cls:'ghost'}
  ]).then(function(v){if(v==='yes')location.reload();});

/* ============================================================
   LANCER LES DÉS
   ============================================================ */
function lancerDesHumains(){
  if(WS.isClient){
    if(S.current===WS.myIndex)wsSend({type:'action',action:'roll'});
    return;
  }
  if(!LANCER_HUMAIN_EN_ATTENTE)return;
  LANCER_HUMAIN_EN_ATTENTE=false;
  if(LANCER_HUMAIN_CALLBACK){var cb=LANCER_HUMAIN_CALLBACK;LANCER_HUMAIN_CALLBACK=null;cb();}
}
async function rollDice(){
  initAudio();playSon('desson',0.9);
  showCenterDice();
  var r1=1+Math.floor(Math.random()*6);var r2=1+Math.floor(Math.random()*6);
  var cube1=document.getElementById('cd1Cube');var cube2=document.getElementById('cd2Cube');
  var face1=getFaceAngles(r1);var face2=getFaceAngles(r2);
  var newRx1=computeNextAngle(diceRotation.cd1.rx,face1.rx);var newRy1=computeNextAngle(diceRotation.cd1.ry,face1.ry);
  var newRx2=computeNextAngle(diceRotation.cd2.rx,face2.rx);var newRy2=computeNextAngle(diceRotation.cd2.ry,face2.ry);
  diceRotation.cd1.rx=newRx1;diceRotation.cd1.ry=newRy1;diceRotation.cd2.rx=newRx2;diceRotation.cd2.ry=newRy2;
  if(cube1)cube1.style.transform='rotateX('+newRx1+'deg) rotateY('+newRy1+'deg)';
  if(cube2)cube2.style.transform='rotateX('+newRx2+'deg) rotateY('+newRy2+'deg)';
  await sleep(2000);
  stopSon('desson');
  logEvent('INFO','Dés: '+r1+'+'+r2+'='+(r1+r2));
  return [r1,r2];
}
function showCenterDice(){var el=document.getElementById('centerDice');if(el)el.classList.add('show');}

/* ============================================================
   ATTERRISSAGE + DO ROLL + NEXT TURN
   ============================================================ */
async function traiterAtterrissage(p,cell){
  var idx=S.players.indexOf(p);

  if(cell.type==='property' && cell.owner==null){
    if(S.mode==='auction'){
      await lancerEnchere(p, cell);
    } else {
      if(p.money>=cell.price){
        p.money-=cell.price;
        cell.owner=idx;
        playBuySound();
        await showMoney(-cell.price,'Achat : '+cell.name);
      } else {
        await showModal(
          '<h2>💸 Fonds insuffisants</h2><p>Vous n\'avez pas assez pour <b>'+cell.name+'</b> ('+fmt(cell.price)+').</p>',
          [{label:'OK',value:'ok',cls:'primary'}]
        );
      }
    }
    return;
  }

  if(cell.type==='property' && cell.owner!=null && cell.owner!==idx){
    var r2=rent(cell);
    if(r2>0){
      p.money-=r2;
      S.players[cell.owner].money+=r2;
      playBadSound();
      await showPayment(p.name,S.players[cell.owner].name,r2);
    }
    return;
  }

  if(cell.type==='tax'){
    p.money-=cell.amount;playBadSound();
    await showMoney(-cell.amount,'Impôts');
  }else if(cell.type==='go'){
    p.money+=20000;playBuySound();
    await showMoney(20000,'Départ');
  }else if(cell.type==='heritage'){
    p.money+=S.heritagePot;
    await showMoney(S.heritagePot,'Héritage');
    S.heritagePot=0;
  }
}

async function doRoll(p){
  if(S.animating)return;
  if(!p.isAI&&!p.isRemote&&!WS.isClient){
    showCenterDice();
    await new Promise(function(resolve){
      LANCER_HUMAIN_EN_ATTENTE=true;LANCER_HUMAIN_CALLBACK=resolve;
      setTimeout(function(){
        if(LANCER_HUMAIN_EN_ATTENTE){
          LANCER_HUMAIN_EN_ATTENTE=false;LANCER_HUMAIN_CALLBACK=null;
          resolve();
        }
      },60000);
    });
  }
  var r=await rollDice();
  var total=r[0]+r[1];
  S.lastDice={d1:r[0],d2:r[1],seq:Date.now()};
  broadcastStateDebounced();
  await animateMove(p,(p.pos+total)%40);
  var cell=BOARD[p.pos];
  await traiterAtterrissage(p,cell);
  updatePanel();
  if(WS.isHost)broadcastState();
}

async function nextTurn(){
  if(S.gameOver)return;
  stopTurnTimer();
  if(MODAL_EN_COURS||ENCHERE_EN_COURS){setTimeout(nextTurn,400);return;}
  if(WS.isClient)return;
  TOUR_EXPIRE=false;
  refreshBoard();
  var alive=S.players.filter(function(p){return p&&!p.bankrupt;});
  if(alive.length<=1){
    S.gameOver=true;var w=alive[0];
    broadcastState();
    if(w)playSon('standing',.9);
    showConfetti();
    await showModal('<h2>🏆 VICTOIRE</h2><p><b>'+(w?w.name:'—')+'</b> gagne !</p>',[{label:'OK',value:'ok',cls:'primary'}]);
    return;
  }
  var safety=0;
  do{S.current=(S.current+1)%S.players.length;safety++;}while((!S.players[S.current]||S.players[S.current].bankrupt)&&safety<20);
  var cur=S.players[S.current];
  if(!cur)return;
  document.getElementById('turnLabel').textContent='Tour de '+cur.name;
  updatePanel();
  broadcastState();

  if(cur.isAI){
    await sleep(500);
    await doRoll(cur);
    if(TOUR_EXPIRE)return;
    await sleep(500);
    nextTurn();
    return;
  }
  if(cur.isRemote){
    startTurnTimer(60,function(){TOUR_EXPIRE=true;closeModal();nextTurn();},cur.name.substring(0,8)+' 🌐');
    broadcastState();
    return;
  }
  var eb=document.getElementById('endTurnBtn');
  if(eb)eb.disabled=false;
  await doRoll(cur);
  if(TOUR_EXPIRE)return;
  startTurnTimer(40,function(){TOUR_EXPIRE=true;closeModal();nextTurn();},cur.name.substring(0,6));
}

function passerTour(){
  if(WS.isClient){
    if(S.current===WS.myIndex)wsSend({type:'action',action:'endTurn'});
    return;
  }
  if(S.animating)return;
  stopTurnTimer();TOUR_EXPIRE=false;
  nextTurn();
}

/* ============================================================
   CONFIGURATION RÉSEAU + LOBBY
   ============================================================ */
function setNetMode(m){
  NET.mode=m;
  ['netLocal','netHost','netJoin'].forEach(function(id){var el=document.getElementById(id);if(el)el.className='';});
  var map={local:'netLocal',host:'netHost',join:'netJoin'};
  var btn=document.getElementById(map[m]);if(btn)btn.className='selected';
  document.getElementById('joinBox').style.display=(m==='join')?'block':'none';
  document.getElementById('hostBox').style.display=(m==='host')?'block':'none';
  document.getElementById('lobbyInfo').style.display=(m==='host')?'block':'none';
}

function onStartClick(){
  if(NET.mode==='host')preparerSalleAttente();
  else if(NET.mode==='join')rejoindrePartie();
  else startLocalGame();
}

function preparerSalleAttente(){
  initAudio();chargerSons();initSoundBtn();
  construireRoueSVG();initDice();
  var name=document.getElementById('pname').value.trim()||'Vous';
  S.players=[{name:name,color:COLORS[0],money:150000,pos:0,isAI:false,jailTurns:0,bankrupt:false,prudence:3}];
  WS.myIndex=0;
  document.getElementById('lobbyInfo').style.display='block';
  document.getElementById('startGameBtn').style.display='block';
  document.getElementById('startBtn').disabled=true;
  document.getElementById('startBtn').textContent='⏳ Salle ouverte';
  rafraichirLobby();
  startHostNetwork();
}

function startHostNetwork(){
  wsConnect(function(){
    WS.isHost=true;WS.isClient=false;
    wsSend({type:'create'});
  });
}

function startJoinNetwork(roomCode){
  wsConnect(function(){
    WS.isClient=true;WS.isHost=false;
    wsSend({type:'join',roomCode:roomCode,name:document.getElementById('pname').value.trim()||'Invité'});
  });
}

function rafraichirLobby(){
  var el=document.getElementById('lobbyPlayers');if(!el)return;
  var html='';
  S.players.forEach(function(p,i){
    if(!p)return;
    var role=i===0?'👑 hôte':(p.isAI?'🤖 IA':'🌐 client');
    html+='<div style="padding:6px 8px;background:rgba(255,255,255,.05);border-radius:6px;border-left:4px solid '+p.color+'">'+role+' <b style="color:#ffd700">'+p.name+'</b></div>';
  });
  var nbIA=parseInt(document.getElementById('paicount').value,10)||0;
  if(nbIA>0)html+='<div style="padding:6px 8px;opacity:.7">🤖 '+nbIA+' IA seront ajoutées au lancement</div>';
  el.innerHTML=html;
  var lc=document.getElementById('lobbyCount');
  if(lc)lc.textContent=(S.players.length-1)+' client(s) connecté(s)';
}

function rejoindrePartie(){
  initAudio();chargerSons();initSoundBtn();
  construireRoueSVG();initDice();
  var code=(document.getElementById('roomCodeInput').value||'').toUpperCase().trim();
  if(code.length<4){alert('Code invalide.');return;}
  document.getElementById('setup').style.display='none';
  document.getElementById('app').style.display='flex';
  document.getElementById('app').innerHTML='<div style="text-align:center;padding:60px"><h1 style="color:#ffd700">Connexion…</h1><p style="margin-top:20px;opacity:.7">Établissement de la connexion au serveur…</p></div>';
  startJoinNetwork(code);
}

function afficherEcranAttente(){
  var app=document.getElementById('app');
  app.innerHTML='<div style="text-align:center;padding:60px">'+
    '<h1 style="color:#ffd700;font-size:36px;margin-bottom:20px">BUSINESS EMPIRE</h1>'+
    '<h2 style="color:#7CFC00;font-size:22px;margin-bottom:16px">⏳ Connecté à l\'hôte</h2>'+
    '<p style="font-size:16px;opacity:.85">En attente du lancement de la partie…</p>'+
    '<div style="margin-top:40px;font-size:80px">🎲</div>'+
    '<div style="margin-top:20px;font-size:14px;opacity:.6">Code salle : <b style="color:#ffd700">'+WS.roomCode+'</b></div>'+
    '</div>';
}

function lancerPartieApresLobby(){
  var nbIA=Math.max(0,Math.min(5,parseInt(document.getElementById('paicount').value,10)||0));
  var nomsMelanges=AINAMES.slice().sort(function(){return Math.random()-.5;});
  var prudMelanges=PRUDENCES.slice().sort(function(){return Math.random()-.5;});
  var idx=S.players.length;
  for(var i=0;i<nbIA;i++){
    S.players[idx+i]={
      name:nomsMelanges[i],
      color:COLORS[(idx+i)%COLORS.length],
      money:150000,pos:0,isAI:true,jailTurns:0,bankrupt:false,
      prudence:prudMelanges[i]||3
    };
  }
  S.players=S.players.filter(function(p){return p;});
  S.current=0;S.gameOver=false;
  S.heritagePot=0;S.social1Pot=0;S.doubleCount=0;
  S.animating=false;S.busy=false;
  for(var j=0;j<40;j++){
    if(BOARD[j].type==='property'||BOARD[j].type==='eaux'||BOARD[j].type==='eaux2'){
      BOARD[j].owner=null;BOARD[j].filiales=0;BOARD[j].hypotheque=false;
    }
  }
  document.getElementById('setup').style.display='none';
  document.getElementById('app').style.display='flex';
  renderBoard();refreshBoard();
  setTimeout(renderOwnerPills,100);setTimeout(renderOwnerPills,400);
  appliquerVue3D();
  document.getElementById('turnLabel').textContent='Tour de '+S.players[0].name;
  logEvent('INFO','Partie lancée — '+S.players.length+' joueurs');
  broadcastState();
  demarrerPremierTour();
}

async function demarrerPremierTour(){
  var eb=document.getElementById('endTurnBtn');
  if(eb)eb.disabled=false;
  await sleep(500);
  await doRoll(S.players[0]);
  startTurnTimer(40,function(){TOUR_EXPIRE=true;nextTurn();},S.players[0].name.substring(0,6));
}

/* ============================================================
   PARTIE LOCALE
   ============================================================ */
async function startLocalGame(){
  initAudio();chargerSons();initSoundBtn();
  construireRoueSVG();initDice();
  NET.mode='local';
  WS.isHost=false;WS.isClient=false;WS.myIndex=0;
  var name=document.getElementById('pname').value.trim()||'Vous';
  var aiCount=Math.max(0,Math.min(5,parseInt(document.getElementById('paicount').value,10)||3));
  var nomsMelanges=AINAMES.slice().sort(function(){return Math.random()-.5;});
  var vehMelanges=COLORS.slice().sort(function(){return Math.random()-.5;});
  var prudMelanges=PRUDENCES.slice().sort(function(){return Math.random()-.5;});
  S.players=[{name:name,color:vehMelanges[0],money:150000,pos:0,isAI:false,jailTurns:0,bankrupt:false,prudence:3}];
  for(var i=0;i<aiCount;i++){
    S.players.push({
      name:nomsMelanges[i],color:vehMelanges[i+1],
      money:150000,pos:0,isAI:true,jailTurns:0,bankrupt:false,
      prudence:prudMelanges[i]||3
    });
  }
  S.current=0;S.gameOver=false;S.heritagePot=0;S.doubleCount=0;S.animating=false;
  for(var j=0;j<40;j++){
    if(BOARD[j].type==='property'||BOARD[j].type==='eaux'||BOARD[j].type==='eaux2'){
      BOARD[j].owner=null;BOARD[j].filiales=0;BOARD[j].hypotheque=false;
    }
  }
  document.getElementById('setup').style.display='none';
  document.getElementById('app').style.display='flex';
  renderBoard();refreshBoard();
  setTimeout(renderOwnerPills,100);setTimeout(renderOwnerPills,400);
  appliquerVue3D();
  document.getElementById('turnLabel').textContent='Tour de '+name;
  await sleep(500);
  await doRoll(S.players[0]);
  startTurnTimer(40,function(){TOUR_EXPIRE=true;nextTurn();},name.substring(0,6));
}
